# Tests run on in-memory H2 (MySQL mode) so no local MySQL is needed. Standard SQL only (ADR 4).
spring.datasource.url=jdbc:h2:mem:ticketradar;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# rule thresholds (test resources replace the main file, so repeat them here)
ticket-radar.rules.price-check-ratio=1.5
ticket-radar.rules.quantity-high-threshold=4

# AI off in tests (Extractor is mocked where needed)
ticket-radar.ai.provider=none
ticket-radar.ai.model=
ticket-radar.ai.gemini-api-key=
ticket-radar.ai.anthropic-api-key=
ticket-radar.ai.timeout-seconds=20
ticket-radar.ai.max-requests-per-minute-per-ip=10
ticket-radar.ai.max-requests-per-minute-total=14
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
