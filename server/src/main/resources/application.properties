spring.application.name=ticket-radar

# Secrets and DB settings come from the repo-root .env (copied from .env.example). Never hardcode them here.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:ticket_radar}?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 규칙 엔진 기준값 (숫자는 코드가 아니라 여기에). 배율 이상이면 "확인 필요", 수량 이상이면 "수량 많음"
ticket-radar.rules.price-check-ratio=1.5
ticket-radar.rules.quantity-high-threshold=4

# AI 추출 (ADR 5). 값은 .env 에서 온다. provider: none | gemini | claude
ticket-radar.ai.provider=${AI_PROVIDER:none}
ticket-radar.ai.model=${AI_MODEL:}
ticket-radar.ai.gemini-api-key=${GEMINI_API_KEY:}
ticket-radar.ai.anthropic-api-key=${ANTHROPIC_API_KEY:}
ticket-radar.ai.timeout-seconds=20
ticket-radar.ai.max-requests-per-minute-per-ip=10
ticket-radar.ai.max-requests-per-minute-total=14

# 캡처 이미지 5MB 이하 (서버가 바이트로 다시 확인)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
